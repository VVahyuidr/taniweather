<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>
  <!-- Background rounded box -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <!-- Sun glow behind cloud -->
  <circle cx="26" cy="24" r="11" fill="url(#sunGrad)" opacity="0.95" />
  <!-- Cloud -->
  <path d="M22 41h22a9 9 0 0 0 1-17.9 12 12 0 0 0-21.6-2.5A8 8 0 0 0 22 41z" fill="url(#cloudGrad)" />
  <!-- Sprout / Leaf of Agriculture -->
  <path d="M42 46c0-7-5.5-12-12-12 0 6.5 5 12 12 12z" fill="url(#leafGrad)" />
  <path d="M42 46c-2.5-3.5-3.5-7.5-3.5-10.5" stroke="#15803D" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <path d="M28 46c0-4.5 3.5-8 8-8 0 4.5-3.5 8-8 8z" fill="#22C55E" opacity="0.9" />
</svg>

